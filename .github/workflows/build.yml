name: Portfolio pipeline

# One serialised pipeline: validate -> build -> quality -> publish.
# Every job is gated on the previous one, so nothing runs independently.

concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'tools/**'
      - 'assets/**'
      - 'styles.css'
      - 'scripts.js'
      - '.htmlvalidate.json'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate:
    name: 1. Validate data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet PyYAML Jinja2

      - name: Validate data/*.yaml
        run: python3 tools/validate.py

  build:
    name: 2. Build pages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --quiet PyYAML Jinja2

      - name: Render pages and JSON assets
        run: python3 tools/build.py

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            *.html
            assets/badge_certifications.json
          if-no-files-found: error
          retention-days: 1

  quality:
    name: 3. Quality gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@9 --config .htmlvalidate.json '*.html'

      - name: Check internal links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          # mailto: links are skipped by default; --exclude-mail was removed upstream.
          args: --offline --no-progress './**/*.html'
          fail: true

  publish:
    name: 4. Publish
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ignore pre-existing CRLF under .github
        # .gitattributes marks *.sh/*.yml as `text`, so files still committed with CRLF read as
        # permanently modified and block any merge. $GIT_DIR/info/attributes outranks
        # .gitattributes; committing the real fix is impossible (GITHUB_TOKEN has no `workflows` scope).
        run: echo '/.github/** -text' >> .git/info/attributes

      - name: Fast-forward to the remote tip
        # Done while the tree is still pristine, so the later push is already up to date
        # and never needs a rebase (which a CRLF-dirty worktree would refuse anyway).
        run: git pull --ff-only origin "${GITHUB_REF#refs/heads/}"

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Normalise committed line endings
        # One-off self-heal: .gitattributes never rewrites blobs already committed as CRLF.
        # .github is excluded because GITHUB_TOKEN cannot push workflow file changes.
        run: git add --renormalize -- . ':(exclude).github'

      - name: Commit and push generated site
        env:
          FILES: '*.html assets/badge_certifications.json'
          COMMIT_MSG_TEMPLATE: 'chore: rebuild site ({COUNT} pages) [skip ci]'
          COUNT_CMD: "ls -1 *.html | wc -l"
        # Piped through sed so a CRLF checkout can't break the shebang/`set -euo pipefail`.
        run: sed 's/\r$//' .github/scripts/commit_and_push.sh | bash
