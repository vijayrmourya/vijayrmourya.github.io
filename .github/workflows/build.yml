name: Build site

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'templates/**'
      - 'tools/build.py'
      - 'tools/validate.py'
      - 'tools/generate_badge_certifications.py'
      - 'assets/badges/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML Jinja2

      - name: Validate data
        run: python3 tools/validate.py

      - name: Build pages and JSON assets
        run: python3 tools/build.py

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: >-
            index.html experience.html projects.html certifications.html
            services.html study.html contact.html
            assets/badge_certifications.json
          COMMIT_MSG_TEMPLATE: "chore: rebuild site from data/*.yaml [skip ci]"
        run: bash .github/scripts/commit_and_push.sh
