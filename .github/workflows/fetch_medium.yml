name: Fetch Medium posts

# Deliberately standalone: assets/medium_posts.json is read by scripts.js in the
# browser, so refreshing it never requires a site rebuild.

concurrency:
  group: fetch-medium
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the rebase in commit_and_push.sh has something to replay onto.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet feedparser

      - name: Run fetch script
        env:
          MEDIUM_USERNAME: vjmourya
          MAX_POSTS: '6'
        run: python3 tools/fetch_medium.py assets/medium_posts.json

      - name: Normalise committed line endings
        # .gitattributes only applies to newly staged content, so blobs already committed as
        # CRLF leave every checkout dirty and block the rebase. Self-healing no-op once clean.
        # .github is excluded: GITHUB_TOKEN has no `workflows` scope, so a renormalised
        # workflow file in the commit makes the push fail with "remote rejected".
        run: git add --renormalize -- . ':(exclude).github'

      - name: Commit and push medium_posts.json
        env:
          FILES: 'assets/medium_posts.json'
          COMMIT_MSG_TEMPLATE: 'chore: update medium posts [skip ci]'
        # Piped through sed so a CRLF checkout can't break the shebang/`set -euo pipefail`.
        run: sed 's/\r$//' .github/scripts/commit_and_push.sh | bash
